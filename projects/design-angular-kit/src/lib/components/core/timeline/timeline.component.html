<div class="it-timeline-wrapper">
  <div class="row">
    @for (element of timelineElements; track $index) {
      <div class="col-12">
        <it-timeline-item
          [title]="element.title"
          [text]="element.text"
          [signature]="element.signature"
          [pinType]="$safeNavigationMigration(element.pin?.type)"
          [pinIcon]="$safeNavigationMigration(element.pin?.icon)"
          [pinText]="$safeNavigationMigration(element.pin?.text)"
          [eventDate]="element.eventDate"
          [dateFormat]="dateFormat"
          [categoryTitle]="$safeNavigationMigration(element.category?.title)"
          [categoryLink]="$safeNavigationMigration(element.category?.link)"
          [showReadMore]="!!element.link?.length"
          [readMoreLink]="element.link" />
      </div>
    }
  </div>
</div>
